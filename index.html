<!DOCTYPE html>
<html>
<head>
<title>Cyber Document Portal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;
}

/* Neon Background */
body::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:#00eaff;
    border-radius:50%;
    filter:blur(180px);
    opacity:.25;
}

/* Main Container */
.container{
    position:relative;
    width:420px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(0,238,255,.4);
    border-radius:25px;
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px #00eaff;
}

/* Title */
h1{
    font-family:'Orbitron',sans-serif;
    color:#00eaff;
    font-size:30px;
    text-shadow:0 0 15px #00eaff;
}

.icon{
    font-size:60px;
    margin-bottom:15px;
}

p{
    margin:20px 0;
    color:#cbd5e1;
}

/* Buttons */
.button{
    display:block;
    text-decoration:none;
    color:white;
    background:#0066ff;
    padding:15px;
    margin:15px;
    border-radius:12px;
    font-weight:bold;
    box-shadow:0 0 15px #0066ff;
    transition:.3s;
}

.button:hover{
    transform:scale(1.08);
    background:#00eaff;
    color:#020617;
    box-shadow:0 0 30px #00eaff;
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<div class="icon">💻</div>

<h1>CYBER PORTAL</h1>

<p>
Welcome to my digital document system.
Click the button below to access my file.
</p>


<a class="button" href="YOUR_DOCUMENT_LINK" target="_blank">
📄YOUR_DOCUMENT_LINK
</a>


<a class="button" href="YOUR_DOWNLOAD_LINK" target="_blank">
⬇ DOWNLOAD FILE
</a>


<div class="footer">
Created by: Your Name<br>
Information Technology Student
</div>

</div>

</body>
</html>
